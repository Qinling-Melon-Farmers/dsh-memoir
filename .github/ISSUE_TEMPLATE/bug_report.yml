name: Bug 报告 (Bug report)
description: 提交可复现的 Bug，支持文本日志、报错、截图或附件；缺信息时会提示补充，不自动关闭。
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请描述复现步骤、环境与实际错误。支持原始文本日志、代码块、截图或附件，请先脱敏。
        冒烟测试、代码定位与补丁均为可选，不要求提问者具备开发能力。机器人仅提示补充信息，不自动关闭 Issue。

        无需自行添加标签或具备打标签权限；机器人会补充 bug 标签，缺标不构成关闭理由。

        提交前请先搜索确认没有重复：[搜索现有 Issue](https://github.com/Qinling-Melon-Farmers/dsh-memoir/issues?q=is%3Aissue)
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: 提交前查重
      description: 提交前请先搜索确认没有重复的 Issue。
      options:
        - label: 我已搜索过 open/closed 的 Issue，确认本 Issue 没有重复。
          required: true
  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      description: 选择问题涉及的模块或区域。
      options:
        - 数据存储（store / SSOT / snapshot）
        - 检索与排序（retrieval / BM25）
        - Hot Memory 选择（selector / token 预算）
        - 工具接口（memoir_record / memoir_read）
        - 路由与 API（routes）
        - Web GUI 面板（client）
        - 打包与挂载（bundle patch / 构建）
        - 自动收尾与会话钩子（autodistill）
        - 测试 / bench
        - 其他 / 不确定
    validations:
      required: true
  - type: dropdown
    id: issue-type
    attributes:
      label: Issue 类型
      description: 本表单仅用于可复现的 Bug；功能请求请使用另一个表单。
      options:
        - Bug 报告
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 摘要
      description: 用一两句话描述 Bug。
      placeholder: 出了什么问题？
    validations:
      required: true
  - type: textarea
    id: expected-outcome
    attributes:
      label: 预期结果
      description: 描述应该发生什么。
      placeholder: 你期望的结果是什么？
    validations:
      required: true
  - type: textarea
    id: details-reproduction
    attributes:
      label: 详情 / 复现步骤
      description: 给出清晰的复现步骤。
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: DSH 版本、浏览器、插件版本与安装方式、操作系统及关键配置。
      placeholder: |
        - DSH 版本:
        - 浏览器:
        - dsh-memoir 版本 / 安装方式（github: / file:）:
        - 操作系统:
        - ~/.dsh/dsh-memoir.json 规模（条数 / 项目数，如相关）:
    validations:
      required: true
  - type: textarea
    id: bug-screenshot
    attributes:
      label: 证据截图 / 日志
      description: 可直接粘贴错误原文、终端日志、代码块、截图或附件链接；不要求把文本转成图片。请移除密钥、私人路径与无关对话。
      placeholder: 粘贴脱敏日志 / 错误信息，或拖入图片、文件。
    validations:
      required: true
  - type: textarea
    id: smoke-test
    attributes:
      label: 冒烟测试
      description: 可选。说明实际执行过的验证与结果；没有测试环境可留空，不要求运行开发命令。
      placeholder: |
        - 环境（DSH / dsh-memoir 版本）:
        - 执行步骤与观察结果:
        - 对照 / 历史版本差异:
    validations:
      required: false
  - type: textarea
    id: code-reference
    attributes:
      label: 引用代码
      description: 可选。若已定位，可提供文件路径、函数或 GitHub 链接。
      placeholder: |
        src/host/store.ts:120-135
        https://github.com/Qinling-Melon-Farmers/dsh-memoir/blob/main/src/host/store.ts#L120-L135
    validations:
      required: false
  - type: textarea
    id: patch
    attributes:
      label: 补丁
      description: 可选。若有建议补丁或实现思路可附上；不提供补丁也欢迎报告问题。
      placeholder: |
        ```diff
        --- a/src/host/store.ts
        +++ b/src/host/store.ts
        @@ ... @@
        ```
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 如有日志、链接或其他上下文，请补充。
    validations:
      required: false
