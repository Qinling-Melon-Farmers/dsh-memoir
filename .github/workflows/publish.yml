name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $expected"
            exit 1
          fi

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Use npm 11 for trusted publishing
        run: npm install --global npm@11

      - name: Publish with trusted publishing (token fallback)
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # OIDC is always the primary path. Merely configuring NPM_TOKEN must
          # not disable trusted publishing or make an expired token fatal.
          set +e
          npm publish --access public --provenance
          oidc_status=$?
          set -e
          if [[ "$oidc_status" -eq 0 ]]; then
            exit 0
          fi

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$(npm view "$package_name@$package_version" version 2>/dev/null || true)" == "$package_version" ]]; then
            echo "npm already exposes $package_name@$package_version; treating the publish as complete."
            exit 0
          fi
          if [[ -z "$NPM_TOKEN" ]]; then
            echo "::error::Trusted publishing failed and no NPM_TOKEN fallback is configured."
            exit "$oidc_status"
          fi
          echo "Trusted publishing failed; retrying with the repository token fallback."
          fallback_npmrc="$(mktemp)"
          trap 'rm -f "$fallback_npmrc"' EXIT
          printf '%s\n' \
            'registry=https://registry.npmjs.org/' \
            "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" \
            > "$fallback_npmrc"
          NPM_CONFIG_USERCONFIG="$fallback_npmrc" \
            NODE_AUTH_TOKEN="$NPM_TOKEN" \
            npm publish --access public --provenance

      - name: Verify npm registry publication
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5 6; do
            if [[ "$(npm view "$package_name@$package_version" version 2>/dev/null || true)" == "$package_version" ]]; then
              echo "Verified $package_name@$package_version on npm."
              exit 0
            fi
            echo "Waiting for npm registry visibility (attempt $attempt/6)."
            sleep 5
          done
          echo "::error::$package_name@$package_version did not become visible on npm."
          exit 1

      - name: Pack release asset
        if: success()
        run: |
          rm -rf release-assets
          mkdir -p release-assets
          npm pack --pack-destination release-assets

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi

          notes_file="$(mktemp)"
          node scripts/render-release-notes.mjs "${RELEASE_TAG#v}" > "$notes_file"

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "dsh-memoir $RELEASE_TAG" \
            --latest \
            --notes-file "$notes_file" \
            release-assets/*.tgz
