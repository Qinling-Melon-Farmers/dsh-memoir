name: Enforce Issue Template

on:
  issues:
    types: [opened, edited, reopened]

concurrency:
  group: issue-template-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  enforce:
    name: Classify issues and request missing information
    runs-on: ubuntu-latest

    steps:
      - name: Validate issue template
        uses: actions/github-script@v8
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue || issue.pull_request || issue.state === 'closed') {
              return;
            }

            const baseRequiredSections = [
              '涉及模块',
              'Issue 类型',
              '摘要',
              '预期结果',
              '详情 / 复现步骤',
              '环境信息',
            ];

            const body = issue.body || '';
            const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const readSection = (label) => {
              const heading = escapeRegExp(label);
              const pattern = new RegExp(`^###[ \\t]+${heading}[ \\t]*\\r?\\n([\\s\\S]*?)(?=^###[ \\t]+|(?![\\s\\S]))`, 'im');
              const match = body.match(pattern);
              return match ? match[1].replace(/<!--[\s\S]*?-->/g, '').trim() : '';
            };

            const isBlank = (value) => {
              const normalized = value.replace(/\s+/g, ' ').trim().toLowerCase();
              return normalized === '' || normalized === 'no response' || normalized === '_no response_';
            };

            const issueType = readSection('Issue 类型').trim().toLowerCase();
            const labels = new Set((issue.labels || []).map((label) =>
              String(typeof label === 'string' ? label : label.name || '').trim().toLowerCase()));
            // Exact form values only: never guess moderation labels from prose.
            const typeLabels = new Map([
              ['bug 报告', 'bug'],
              ['功能请求', 'enhancement'],
              ['文档', 'documentation'],
              ['问题', 'question'],
            ]);
            const typeLabel = typeLabels.get(issueType);
            const isBug = typeLabel === 'bug' || labels.has('bug');
            const requiredSections = isBug
              ? [...baseRequiredSections, '证据截图 / 日志']
              : baseRequiredSections;

            const missingSections = requiredSections.filter((label) => isBlank(readSection(label)));
            const classification = isBug ? 'bug' : typeLabel;
            if (classification && !labels.has(classification)) {
              // Classification is the bot's responsibility: external reporters
              // may not have permission to add labels themselves. Preserve
              // existing labels; permission/configuration failures are not
              // invalid reports and must not bypass independent body checks.
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: [classification],
                });
              } catch {
                core.warning(`Issue #${issue.number}: could not add classification label; maintainers should check label configuration and workflow permissions. Reporters do not need to add labels. Template validation continues independently.`);
              }
            }
            const missingSectionMessages = missingSections.length > 0
              ? [`缺少或为空的必填部分：${missingSections.join(', ')}`]
              : [];

            // Evidence can be plain text, code blocks, logs, images or files.
            // A template checker cannot judge validity or overrule a maintainer.
            const marker = '<!-- memoir-issue-template-advice-v2 -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: issue.number, per_page: 100,
            });
            const existing = comments.find(item => item.user?.login === 'github-actions[bot]' && item.body?.includes(marker));
            if (missingSections.length === 0 && !existing) return;
            const comment = [marker, ...(missingSections.length === 0 ? [
              '已检测到所需信息，感谢补充。Issue 保持原状态，后续由维护者审阅。',
              'Required sections are present. Thank you; a maintainer will review this report.',
            ] : [
              '自动检查发现以下信息可能尚未提供；Issue 保持开放，由维护者判断。',
              '',
              ...missingSectionMessages,
              '',
              '日志、错误原文、文本代码块、截图或附件均可作为证据；请脱敏。冒烟测试、代码定位和补丁是可选协助，不要求用户会编程。请补充原 Issue，无需重提或自行打标签。',
              'This is an advisory only: the issue stays open. Plain-text logs are accepted; tests, code references and patches are optional. Please redact secrets and update this issue rather than opening another.',
            ])].join('\n');
            if (existing) {
              if (existing.body !== comment) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body: comment });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: comment });
            }
