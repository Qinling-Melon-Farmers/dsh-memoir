# dsh-memoir bundle patch: inserts the host-half plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
#   dsh plugin --profile web add github:<owner>/dsh-memoir
# or, for local development,
#   dsh plugin --profile web add file:<abs path to this directory>
#
# The row is a bare plugin by package name: the node half (exports ".")
# registers the memoir_record / memoir_read tools, the /api/dsh-memoir panel
# routes, the turn-end auto-distill listener, and the per-project
# system-prompt announcement; the browser half (exports "./client") renders
# the sidebar entry + memory panel.
#
# Optional config (all default true):
#   config:
#     enabled: true          # master switch (tools, routes, prompt section)
#     announceToAgent: true  # system-prompt announcement
#     autoDistill: true      # steer a distill prompt after each worked turn
#     autoDistillEvery: 1    # remind at most once per N worked turns
#     autoDistillCooldownMin: 0 # minimum minutes between successful reminders
#     autoDistillMinTools: 1 # minimum tool calls on the triggering turn
# All fields except enabled are startup defaults. v0.5.4+ can persist complete
# live overrides from the Memory panel or Settings -> Web UI Plugins:
#   hotMemoryTokens: 900
#   hotMemoryMaxTokens: 1200
#   readDefaultLimit: 8
#   readMaxLimit: 30
#   sessionSnapshotMax: 128
#   queryCacheSize: 128
# Overrides live in ~/.dsh/dsh-memoir.settings.json and can be reset.
- insert:
    - id: memoir
      name: dsh-memoir
